{% extends "base.html" %}
{% block title %}删除任务 - StudyTask{% endblock %}
{% block content %}

<h1>删除任务</h1>

<p class="confirm-text">
  确定要删除任务「<strong>{{ task['name'] }}</strong>」（课程：{{ task['course'] }}，截止：{{ task['due_date'] }}）吗？
  删除后无法恢复。
</p>

<form method="post" action="{{ url_for('delete_task', task_id=task['id']) }}">
  <button class="btn btn-danger" type="submit">确认删除</button>
  <a class="btn btn-link" href="{{ url_for('task_detail', task_id=task['id']) }}">取消</a>
</form>

{% endblock %}
